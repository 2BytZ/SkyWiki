<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Himmeloften</title>
    <link rel="icon" href="/favicon.ico">
    <script>
        // Apply the saved theme before anything is drawn
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("skyrim-wiki-theme"); } catch (e) {}
            if (theme !== "light" && theme !== "dark") {
                theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script src="/js/parts.js"></script>
    <style>
        :where(html[data-theme="dark"]) { background: #1d1d1d; color-scheme: dark; }
        :where(html[data-theme="light"]) { background: #FCFFF0; color-scheme: light; }
    </style>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/dovahzul.css">
    <link rel="stylesheet" href="/css/Navbar.css">
    <link rel="stylesheet" href="/css/Footer.css">
    <link rel="stylesheet" href="/css/PageFooter.css">
    <link rel="stylesheet" href="/css/credits.css">
    <script type="module" src="/js/site.js"></script>
</head>
<body>
<div id="root">
<site-header></site-header>
<main class="mw-page-container">
    <script>
        (function () {
            var match = location.pathname.match(/^\/wiki\/([\w-]+)\/?$/);
            var pages = ["Home", "Dranleic_Haligdrake", "Pharis_Ironeye", "Credits"];
            if (match && pages.indexOf(match[1]) !== -1) location.replace("/wiki/" + match[1] + ".html" + location.hash);
            else if (location.pathname === "/wiki" || location.pathname === "/wiki/") location.replace("/wiki/Home.html");
        })();
    </script>
    <div class="credits-page">
        <h1>Page not found</h1>
        <p>There's no page at this address. Go back to the <a href="/wiki/Home.html">home page</a>.</p>
    </div>
</main>
<site-footer></site-footer>
</div>
</body>
</html>
